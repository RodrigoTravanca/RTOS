<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MicroPython Terminal</title>
    <script src="micropython.mjs" type="module"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0d0d0d;
        color: #d4d4d4;
        font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
        height: 100%;
      }
      #term {
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        padding: 12px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
        line-height: 1.4;
      }
      #term::-webkit-scrollbar { width: 8px; }
      #term::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

      .line { white-space: pre-wrap; }
      .prompt-line { display: flex; }
      .prompt-label { flex-shrink: 0; white-space: pre; }
      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #d4d4d4;
        font: inherit;
        caret-color: #4ec9b0;
      }
      .stderr { color: #f14c4c; }
      .stdout { color: #d4d4d4; }
    </style>
  </head>
  <body>
    <div id="term"></div>

    <script type="module">
      const termEl = document.getElementById("term");

      function appendText(text, cls) {
        if (!text) return;
        const span = document.createElement("span");
        span.className = cls || "stdout";
        span.textContent = text;
        termEl.appendChild(span);
        termEl.scrollTop = termEl.scrollHeight;
      }

      const stdoutWriter = (line) => {
        // The REPL occasionally flushes its own internal ">>> "/"... " prompt
        // into stdout as a standalone line, and on successful runs it also
        // echoes the code that was just executed. We render prompts and
        // typed code ourselves via the input row, so drop both.
        if (line.trim() === ">>>" || line.trim() === "...") {
          return;
        }
        if (suppressEchoLines.length > 0) {
          const idx = suppressEchoLines.indexOf(line);
          if (idx !== -1) {
            suppressEchoLines.splice(idx, 1);
            return;
          }
        }
        appendText(line + "\n", "stdout");
      };

      let suppressEchoLines = [];

      const mp = await loadMicroPython({ stdout: stdoutWriter });
      mp.replInit();

      let history = [];
      let historyIndex = -1;
      let currentLine = null;
      let currentInput = null;

      function createPromptLine(promptStr) {
        const wrapper = document.createElement("div");
        wrapper.className = "prompt-line";

        const label = document.createElement("span");
        label.className = "prompt-label";
        label.textContent = promptStr;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "input-field";
        input.spellcheck = false;
        input.autocomplete = "off";
        input.autocapitalize = "off";

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        termEl.appendChild(wrapper);

        input.focus();
        termEl.scrollTop = termEl.scrollHeight;

        return { wrapper, input };
      }

      function freezeLine(wrapper, input, promptStr, text) {
        // Replace the live input with static text once submitted
        wrapper.innerHTML = "";
        const label = document.createElement("span");
        label.className = "prompt-label";
        label.textContent = promptStr;
        const staticText = document.createElement("span");
        staticText.textContent = text;
        wrapper.appendChild(label);
        wrapper.appendChild(staticText);
      }

      async function runCode(code) {
        // The REPL echoes back each physical line it executes on success
        // (e.g. print("hi") -> stdout gets an extra 'print("hi")' line).
        // We already show the typed code ourselves, so suppress those.
        suppressEchoLines = code.split("\n").slice();
        try {
          const result = await mp.runPythonAsync(code);
          if (result !== undefined && result !== null) {
            // MicroPython proxies may return objects; try to stringify safely
            try {
              appendText(String(result) + "\n", "stdout");
            } catch (e) {
              // ignore unstringifiable results
            }
          }
        } catch (err) {
          appendText((err && err.message ? err.message : String(err)) + "\n", "stderr");
        } finally {
          suppressEchoLines = [];
        }
      }

      function needsContinuation(buffer) {
        const lines = buffer.split("\n");
        const lastLine = lines[lines.length - 1];
        let depth = 0;
        for (const ch of buffer) {
          if (ch === "(" || ch === "[" || ch === "{") depth++;
          else if (ch === ")" || ch === "]" || ch === "}") depth--;
        }
        if (depth > 0) return true;
        if (lastLine.trim().endsWith(":")) return true;
        if (lastLine.endsWith("\\")) return true;
        return false;
      }

      async function promptLoop() {
        let buffer = "";
        let inContinuation = false;

        while (true) {
          const promptStr = inContinuation ? "... " : ">>> ";
          const { wrapper, input } = createPromptLine(promptStr);
          currentInput = input;

          const line = await new Promise((resolve) => {
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                if (e.shiftKey) {
                  // Manual newline insertion within the same input box
                  const pos = input.selectionStart;
                  input.value = input.value.slice(0, pos) + "\n" + input.value.slice(pos);
                  input.selectionStart = input.selectionEnd = pos + 1;
                  e.preventDefault();
                  return;
                }
                e.preventDefault();
                resolve(input.value);
              } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (historyIndex > 0) {
                  historyIndex--;
                  input.value = history[historyIndex];
                }
              } else if (e.key === "ArrowDown") {
                e.preventDefault();
                if (historyIndex < history.length - 1) {
                  historyIndex++;
                  input.value = history[historyIndex];
                } else {
                  historyIndex = history.length;
                  input.value = "";
                }
              }
            });
          });

          freezeLine(wrapper, input, promptStr, line);

          if (inContinuation && line.trim() === "") {
            // Blank line ends a continuation block
            await runIfNonEmpty(buffer);
            buffer = "";
            inContinuation = false;
            continue;
          }

          buffer = buffer.length > 0 ? buffer + "\n" + line : line;

          if (needsContinuation(buffer)) {
            inContinuation = true;
            continue;
          }

          if (buffer.trim().length > 0) {
            await runIfNonEmpty(buffer);
          }
          buffer = "";
          inContinuation = false;
        }
      }

      async function runIfNonEmpty(code) {
        if (code.trim().length === 0) return;
        history.push(code);
        historyIndex = history.length;
        await runCode(code);
      }

      // Keep focus on the active input whenever the terminal is clicked
      termEl.addEventListener("click", () => {
        if (currentInput) currentInput.focus();
      });

      promptLoop();
    </script>
  </body>
</html>
